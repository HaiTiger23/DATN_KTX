<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTX Manager | Premium Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast-container"></div>
    
    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
        <div class="login-card glass">
            <div class="logo">
                <div class="icon">🏢</div>
                <h2>KTX Manager</h2>
            </div>
            <p class="subtitle">Đăng nhập hệ thống quản lý</p>
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="admin@dorm.com" />
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" required placeholder="••••••••" />
                </div>
                <button type="submit" class="btn btn-primary" id="login-btn">
                    <span>Đăng nhập</span>
                    <div class="loader hidden"></div>
                </button>
                <div style="text-align:center;margin-top:1rem;font-size:0.9rem">
                    Chưa có tài khoản? <a href="#" id="show-register" style="color:var(--primary);text-decoration:none;font-weight:600">Đăng ký sinh viên</a>
                </div>
            </form>

            <form id="register-form" class="hidden">
                <div class="form-group">
                    <label>Họ tên (*)</label>
                    <input type="text" id="reg-fullname" required placeholder="Nguyễn Văn A" />
                </div>
                <div class="form-group">
                    <label>Email (*)</label>
                    <input type="email" id="reg-email" required placeholder="sv@dorm.com" />
                </div>
                <div class="form-group">
                    <label>Mật khẩu (*)</label>
                    <input type="password" id="reg-password" required placeholder="••••••••" />
                </div>
                <div class="form-group">
                    <label>MSSV</label>
                    <input type="text" id="reg-mssv" placeholder="SV001" />
                </div>
                <button type="submit" class="btn btn-primary" id="register-btn">
                    <span>Đăng ký</span>
                    <div class="loader hidden"></div>
                </button>
                <div style="text-align:center;margin-top:1rem;font-size:0.9rem">
                    Đã có tài khoản? <a href="#" id="show-login" style="color:var(--primary);text-decoration:none;font-weight:600">Đăng nhập</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="screen">
        <aside class="sidebar glass">
            <div class="sidebar-header">
                <div class="icon">🏢</div>
                <h2>KTX Admin</h2>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Nav items will be generated by JS -->
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar">A</div>
                    <div>
                        <p class="name" id="user-name">Admin</p>
                        <p class="role">Quản trị viên</p>
                    </div>
                </div>
                <button id="logout-btn" class="btn btn-icon" title="Đăng xuất">🚪</button>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="top-header glass">
                <h1 id="page-title">Quản lý Phòng ở</h1>
                <div class="header-actions">
                    <button class="btn btn-outline" id="sync-btn">🔄 Đồng bộ</button>
                    <button class="btn btn-primary" id="add-btn">+ Thêm mới</button>
                </div>
            </header>
            
            <div class="content-area" id="content-area">
                <!-- Dynamic content will be rendered here -->
            </div>
        </main>
    </div>

    <!-- Modal Template -->
    <div class="modal-overlay hidden" id="modal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h3 id="modal-title">Tiêu đề</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Form content -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline close-modal">Hủy</button>
                <button class="btn btn-primary" id="modal-save-btn">Lưu</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
